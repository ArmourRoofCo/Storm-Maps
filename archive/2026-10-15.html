<script>
(function(){
  var C={"date": "2026-10-15", "key": "2026-10-15", "label": "Thu 10/15/2026", "live": "https://armourroofco.github.io/Storm-Maps/"};
  var sel=document.getElementById('sm-date-sel'), note=document.getElementById('sm-date-note');
  function opt(v,t,s){var o=document.createElement('option');o.value=v;o.textContent=t;if(s)o.selected=true;sel.appendChild(o);}
  function only(){sel.innerHTML='';opt('',C.label,true);sel.disabled=true;note.innerHTML=' <a href="'+C.live+'" target="_blank">open live map for other dates</a>';}
  function build(j,base){
    var L=j.dates||[];if(!L.length){only();return;}
    sel.innerHTML='';sel.disabled=false;note.innerHTML='';var have=false;
    L.forEach(function(e){var t=e.label+(e.key===j.latest?' \u2014 latest':'')+(e.summary?' \u00b7 '+e.summary:'');
      var s=e.key===C.key;have=have||s;opt(e.key,t,s);});
    if(!have)opt(C.key,C.label+' (this file)',true);
    sel.onchange=function(){var k=sel.value;var e=L.filter(function(x){return x.key===k;})[0];if(!e)return;
      window.location.href=(k===j.latest)?(base||'./'):(base+e.file);};
    if(C.key!==j.latest){note.innerHTML=' archived report \u00b7 <a href="'+(base||'./')+'">back to latest</a>';}
    // ?date=YYYY-MM-DD on the live root jumps to that archived day
    var q=(location.search.match(/[?&]date=([0-9A-Za-z-]+)/)||[])[1];
    if(q&&q!==C.key){var e=L.filter(function(x){return x.key===q;})[0];if(e&&q!==j.latest)location.replace(base+e.file);}
  }
  function get(u){return fetch(u+(u.indexOf('?')<0?'?':'&')+'t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw r.status;return r.json();});}
  var onLive=/^https?:$/.test(location.protocol);
  only();
  (onLive?get('archive/index.json').then(function(j){build(j,'');}):Promise.reject())
   .catch(function(){return get(C.live+'archive/index.json').then(function(j){build(j,C.live);});})
   .catch(function(){only();});
})();
</script>

<script>
(function(){
  var NARROW=768, K_F='sm.filters.open', K_L='sm.legend.open';
  function get(k){try{var v=localStorage.getItem(k);return v===null?null:v==='1';}catch(e){return null;}}
  function put(k,v){try{localStorage.setItem(k,v?'1':'0');}catch(e){}}
  function dflt(k){var v=get(k);return v===null?window.innerWidth>=NARROW:v;}
  function makeBtn(name,key,hosts){
    var b=document.createElement('button');b.type='button';b.className='sm-fold-btn';
    function set(open,save){
      hosts.forEach(function(h){h.classList.toggle('sm-folded',!open);});
      b.textContent=name+(open?' \u25BE':' \u25B8');b.setAttribute('aria-expanded',open?'true':'false');
      b.title=(open?'Hide ':'Show ')+name.toLowerCase();
      if(save)put(key,open);
      clearPicker();
    }
    b.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();
      set(hosts[0].classList.contains('sm-folded'),true);});
    b._smSet=set;return b;
  }
  function stopMap(el){if(window.L&&L.DomEvent){L.DomEvent.disableClickPropagation(el);L.DomEvent.disableScrollPropagation(el);}}
  function setupFilters(){
    var cs=[].slice.call(document.querySelectorAll('.leaflet-control-layers')).filter(function(c){return !c.classList.contains('sm-fold-host');});
    if(!cs.length)return false;
    cs.forEach(function(c,i){
      c.classList.add('sm-fold-host');
      var b=makeBtn(cs.length>1?'Filters '+(i+1):'Filters',K_F,[c]);
      b.id=i?'sm-filters-btn-'+(i+1):'sm-filters-btn';
      c.insertBefore(b,c.firstChild);b._smSet(dflt(K_F),false);
    });
    return true;
  }
  function setupLegends(){
    var ds=[].slice.call(document.querySelectorAll('div[style]')).filter(function(d){
      var s=(d.getAttribute('style')||'').replace(/\s+/g,'').toLowerCase();
      return s.indexOf('position:fixed')>=0 && !d.closest('#sm-datepick') && d.id!=='sm-datepick' &&
             !d.classList.contains('sm-legend-host') && !d.closest('.leaflet-container') && d.title!=='Gray markers have been called';
    });
    ds.forEach(function(d,i){
      d.classList.add('sm-legend-host');
      var body=document.createElement('div');body.className='sm-fold-body';
      while(d.firstChild)body.appendChild(d.firstChild);
      var b=makeBtn(ds.length>1?'Legend '+(i+1):'Legend',K_L,[d]);
      b.id=i?'sm-legend-btn-'+(i+1):'sm-legend-btn';
      d.appendChild(b);d.appendChild(body);stopMap(d);b._smSet(dflt(K_L),false);
    });
    return ds.length>0;
  }
  // keep the top map controls (Filters, zoom, search) clear of the centred date picker when they would overlap
  function clearPicker(){
    var p=document.getElementById('sm-datepick'),tops=document.querySelectorAll('.leaflet-top');
    for(var i=0;i<tops.length;i++)tops[i].style.top='';
    if(!p)return;var r=p.getBoundingClientRect();if(!r.height)return;
    var narrow=window.innerWidth<NARROW,hits=[];
    for(i=0;i<tops.length;i++){var hit=false;
      [].slice.call(tops[i].children).forEach(function(c){var q=c.getBoundingClientRect();
        if(q.width&&q.left<r.right&&q.right>r.left&&q.top<r.bottom)hit=true;});
      hits.push(hit);}
    var any=hits.some(function(h){return h;});
    // on phones shift both top corners together so the right column never lands on the left search box
    for(i=0;i<tops.length;i++)if(hits[i]||(narrow&&any))tops[i].style.top=Math.ceil(r.bottom+4-tops[i].getBoundingClientRect().top)+'px';
  }
  var tries=0,fOK=false,lDone=false;
  function run(){
    if(!lDone){lDone=true;setupLegends();}  // static legend HTML only (one pass; never the called-counter)
    if(!fOK)fOK=setupFilters();
    clearPicker();
    if(!fOK&&++tries<40)setTimeout(run,250);
  }
  window.addEventListener('resize',clearPicker);
  if(window.MutationObserver){var p=document.getElementById('sm-datepick');if(p)new MutationObserver(clearPicker).observe(p,{childList:true,subtree:true,characterData:true});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
})();
</script>
